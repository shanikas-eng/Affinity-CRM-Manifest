# SAMPLE SECRETS FILE — DO NOT COMMIT REAL VALUES.
#
# Kept in-repo as the canonical shape for what must exist in every crm-* namespace
# *before* ArgoCD syncs the Application. ArgoCD does NOT create these — they are
# bootstrapped out-of-band by the operator.
#
# There are two ways to apply. Pick ONE:
#
#   (A) Recommended — use kubectl imperative commands (below).
#       The values never touch Git. Rotation = re-run the create command.
#
#   (B) Copy this file to a local secrets.crm-demo.yaml, fill values, run
#       `kubectl apply -f secrets.crm-demo.yaml`, then DELETE the local copy.
#       DO NOT commit the filled file. .gitignore already excludes secrets.*.yaml.
#
# See also: docs/crm-dev-secrets.md (same pattern, different namespace/creds).

# ─── (A) Imperative bootstrap (copy-paste-run on master) ────────────────────
#
#   export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
#   NS=crm-demo
#   kubectl create namespace $NS --dry-run=client -o yaml | kubectl apply -f -
#
#   # 1) Docker Hub pull secret — same PAT used by every other namespace.
#   #    Get the current PAT value from HANDOVER.md § "Docker Hub" (do NOT commit it).
#   kubectl create secret docker-registry dockerhub \
#     --docker-server=https://index.docker.io/v1/ \
#     --docker-username=sysadminaffiniti \
#     --docker-password="$DOCKERHUB_PAT" \
#     --docker-email=devops@affiniti.biz \
#     -n $NS
#
#   # 2) MariaDB credentials — schema/port DIFFER from crm-dev.
#   #    Source: /opt/Docker/ProductDevelopment/Docker-Composer/docker-compose.yml
#   #    Host: 178.128.24.68  Port: 55306  Schema: pdcrmdev03
#   kubectl create secret generic mariadb \
#     --from-literal=url='jdbc:mariadb://178.128.24.68:55306/pdcrmdev03?zeroDateTimeBehavior=convertToNull' \
#     --from-literal=username='pddevusr' \
#     --from-literal=password='password@123' \
#     -n $NS
#
#   # Verify
#   kubectl get secret -n $NS
#   kubectl get secret mariadb -n $NS -o jsonpath='{.data.url}' | base64 -d ; echo
#
# ─── (B) Declarative form (for reference / dev laptops only) ────────────────

---
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub
  namespace: crm-demo
type: kubernetes.io/dockerconfigjson
data:
  # echo -n '{"auths":{"https://index.docker.io/v1/":{"username":"sysadminaffiniti","password":"<PAT>","email":"devops@affiniti.biz","auth":"<base64(user:pat)>"}}}' | base64 -w0
  .dockerconfigjson: REPLACE_WITH_BASE64_DOCKERCONFIGJSON

---
apiVersion: v1
kind: Secret
metadata:
  name: mariadb
  namespace: crm-demo
type: Opaque
stringData:
  # stringData lets you paste plaintext — k8s base64-encodes on apply.
  # Do NOT commit real values. Use imperative form above in real environments.
  url: "jdbc:mariadb://178.128.24.68:55306/pdcrmdev03?zeroDateTimeBehavior=convertToNull"
  username: "pddevusr"
  password: "REPLACE_ME"
