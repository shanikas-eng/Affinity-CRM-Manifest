# crm-demo — migrated from /opt/Docker/ProductDevelopment/Docker-Composer/docker-compose.yml
# on 178.128.19.250 (Node "avonet-demo" once joined).
#
# Original stack was Docker Compose network pd-qa-network; ports were exposed on the
# host as :8500/:8501/:9001/... — none of those are needed here because Services + the
# shared Gateway HTTPRoute now front the pods.
#
# Image tag conventions in the source compose are all MUTABLE:
#   pd-qa-latest, pd-develop-latest, pd4-qa-latest, mrkt-drop1-latest
# We keep them + imagePullPolicy: Always so `kubectl rollout restart` pulls fresh.
# Move to immutable :1.0.x.NNNN tags whenever the CI pipeline is wired here.
#
# DB: external MariaDB at 178.128.24.68:55306, schema pdcrmdev03 — NOT the same
# port/schema as crm-dev (which is :3306 / pdcrmdev02). Credentials live in the
# `mariadb` Secret (see docs/crm-demo-secrets.md).

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-discovery-service
  namespace: crm-demo
spec:
  replicas: 1
  selector: { matchLabels: { app: pd-discovery-service } }
  template:
    metadata: { labels: { app: pd-discovery-service } }
    spec:
      imagePullSecrets: [{ name: dockerhub }]
      containers:
        - name: app
          image: sysadminaffiniti/affiniti_dms_ms_discovery_server:pd-qa-latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8400 }]
          env:
            - { name: SERVER_PORT, value: "8400" }
            - { name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE, value: "http://pd-discovery-service:8400/eureka" }
            - { name: EUREKA_INSTANCE_PREFER_IP_ADDRESS, value: "true" }
---
apiVersion: v1
kind: Service
metadata: { name: pd-discovery-service, namespace: crm-demo }
spec:
  selector: { app: pd-discovery-service }
  ports: [{ port: 8400, targetPort: 8400 }]

---
apiVersion: apps/v1
