# Viewer roles and ServiceAccounts.
#
# Three tiers of access:
#   1. logs-viewer-all       -> read pods/logs in ALL namespaces (cluster-wide)
#   2. logs-viewer-crm-dev   -> read pods/logs ONLY in crm-dev
#   3. logs-viewer-crm-new   -> read pods/logs ONLY in crm-new
#
# All are read-only. Users authenticate to Kubetail by pasting the SA token
# on the login page. See docs/kubetail-user-access.md for how to mint tokens.
#
# RBAC design — why three ClusterRoles instead of one:
#
#   logs-viewer                 (namespaced verbs: pods, logs, workloads)
#     -> RoleBinding in target ns  → scoped viewers see their ns only
#     -> ClusterRoleBinding        → logs-viewer-all sees every ns
#
#   logs-viewer-namespace-list  (cluster-scoped: list namespaces)
#     -> ClusterRoleBinding to ALL viewers so the UI namespace-picker works
#
#   logs-viewer-api-access      (cluster-scoped: api.kubetail.com/graphql etc.)
#     -> ClusterRoleBinding to ALL viewers so log-tail requests through the
#        aggregated API server succeed (this is *not* namespaced; a plain
#        RoleBinding cannot grant it, even for scoped viewers).
#
# The aggregated API server (kubetail-cluster-api) then impersonates the
# user when calling the core k8s API, so namespace-scoped pod/log access
# is still enforced via the RoleBinding.

# ──────────────────────────────────────────────────────────────────────────
# Shared ClusterRole 1/3 — namespaced read-only pod + workload access
# ──────────────────────────────────────────────────────────────────────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logs-viewer
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]

# ──────────────────────────────────────────────────────────────────────────
# Shared ClusterRole 2/3 — cluster-scoped namespace listing (for UI picker)
# ──────────────────────────────────────────────────────────────────────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logs-viewer-namespace-list
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  # Kubetail's cluster-api queries `nodes` cluster-wide to show which node
  # each pod runs on and to enumerate log-file paths on disk. Without this
  # the UI throws: `nodes is forbidden ... cannot list resource "nodes"`.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]

# ──────────────────────────────────────────────────────────────────────────
# Shared ClusterRole 3/3 — access to Kubetail's aggregated API server
# (cluster-scoped resources under api.kubetail.com/v1)
# ──────────────────────────────────────────────────────────────────────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logs-viewer-api-access
rules:
  - apiGroups: [api.kubetail.com]
    resources: [graphql, download, healthz]
    verbs: [get, list, create]

# ──────────────────────────────────────────────────────────────────────────
# Tier 1 — logs-viewer-all: cluster-wide read access
# ──────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logs-viewer-all
  namespace: kubetail

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logs-viewer-all
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logs-viewer
subjects:
  - kind: ServiceAccount
    name: logs-viewer-all
    namespace: kubetail

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logs-viewer-all-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logs-viewer-api-access
subjects:
  - kind: ServiceAccount
    name: logs-viewer-all
    namespace: kubetail

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logs-viewer-all-ns-list
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logs-viewer-namespace-list
subjects:
  - kind: ServiceAccount
    name: logs-viewer-all
    namespace: kubetail

# ──────────────────────────────────────────────────────────────────────────
# Tier 2 — logs-viewer-crm-dev: only crm-dev namespace
# ──────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logs-viewer-crm-dev
  namespace: kubetail

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logs-viewer-crm-dev-ns-list
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logs-viewer-namespace-list
subjects:
  - kind: ServiceAccount
    name: logs-viewer-crm-dev
    namespace: kubetail

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logs-viewer-crm-dev-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logs-viewer-api-access
subjects:
  - kind: ServiceAccount
    name: logs-viewer-crm-dev
    namespace: kubetail

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: logs-viewer-crm-dev
  namespace: crm-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logs-viewer
subjects:
  - kind: ServiceAccount
    name: logs-viewer-crm-dev
    namespace: kubetail

# ──────────────────────────────────────────────────────────────────────────
# Tier 3 — logs-viewer-crm-new: only crm-new namespace
# ──────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logs-viewer-crm-new
  namespace: kubetail

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logs-viewer-crm-new-ns-list
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logs-viewer-namespace-list
subjects:
  - kind: ServiceAccount
    name: logs-viewer-crm-new
    namespace: kubetail

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logs-viewer-crm-new-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logs-viewer-api-access
subjects:
  - kind: ServiceAccount
    name: logs-viewer-crm-new
    namespace: kubetail

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: logs-viewer-crm-new
  namespace: crm-new
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logs-viewer
subjects:
  - kind: ServiceAccount
    name: logs-viewer-crm-new
    namespace: kubetail
