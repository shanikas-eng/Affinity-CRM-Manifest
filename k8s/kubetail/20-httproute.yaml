# Kubetail — HTTPRoute
# Exposes: https://kubetail.affiniti-crm2.duckdns.org/
# Uses the crm2-wildcard-tls cert on the https-crm listener of the shared
# `public` Gateway in gateway-system. No new DNS record or cert required.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubetail-dashboard
  namespace: kubetail
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https-crm
  hostnames:
    - "kubetail.affiniti-crm2.duckdns.org"
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: kubetail-dashboard
          port: 8080
          weight: 1
